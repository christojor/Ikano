services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ikano
      POSTGRES_USER: ikano
      POSTGRES_PASSWORD: ikano
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ikano -d ikano"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ikano
      DB_USER: ikano
      DB_PASSWORD: ikano
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
