services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ikano
      POSTGRES_USER: ikano
      POSTGRES_PASSWORD: ikano
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data:
