name: ci

on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  SECURITY_ARTIFACT_RETENTION_DAYS: "30"

jobs:
  lint_and_typecheck:
    name: Lint and Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy app tests alembic

  security_policy_gates:
    name: Security Policy Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint_and_typecheck

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install bandit pip-audit

      - name: Validate security exceptions
        id: exception_args
        run: |
          python .github/scripts/security_exceptions.py validate
          python .github/scripts/security_exceptions.py trivy-ignorefile .trivyignore.ci
          {
            echo "pip_audit_args<<EOF"
            python .github/scripts/security_exceptions.py pip-audit-args
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Bandit (high severity/high confidence)
        run: bandit -r app -f json -o bandit-report.json -lll -iii

      - name: pip-audit (strict)
        run: |
          read -r -a ignore_args <<< "${{ steps.exception_args.outputs.pip_audit_args }}"
          pip-audit --strict --format json --output pip-audit-report.json "${ignore_args[@]}"

      - name: Gitleaks (secrets)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2 detect \
            --source /repo \
            --no-git \
            --redact \
            --report-format sarif \
            --report-path /repo/gitleaks.sarif \
            --exit-code 1

      - name: Upload security gate artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-gates-reports
          path: |
            bandit-report.json
            pip-audit-report.json
            gitleaks.sarif
            .trivyignore.ci
          if-no-files-found: ignore
          retention-days: ${{ env.SECURITY_ARTIFACT_RETENTION_DAYS }}

  python_tests:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - lint_and_typecheck
      - security_policy_gates

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ikano
          POSTGRES_PASSWORD: ikano
          POSTGRES_DB: ikano
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: ikano
      DB_USER: ikano
      DB_PASSWORD: ikano
      INTEGRATION_TESTS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run pytest
        run: pytest -q

  api_tests_newman:
    name: API Tests (Newman)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: python_tests

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ikano
          POSTGRES_PASSWORD: ikano
          POSTGRES_DB: ikano
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: ikano
      DB_USER: ikano
      DB_PASSWORD: ikano

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          npm ci --no-fund --no-audit

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Start app
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/ > /dev/null; then
              echo "App is ready"
              exit 0
            fi
            sleep 1
          done
          echo "App failed to start"
          cat uvicorn.log
          exit 1

      - name: Run Newman tests
        run: npm run test:api:ci

  build:
    name: Build and Push App Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: api_tests_newman

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate security exceptions
        run: |
          python .github/scripts/security_exceptions.py validate
          python .github/scripts/security_exceptions.py trivy-ignorefile .trivyignore.ci

      - name: Build local image for security scan
        run: docker build -t ikano-ci:${{ github.sha }} .

      - name: Trivy container scan (HIGH/CRITICAL)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" \
            aquasec/trivy:0.55.2 image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format json \
            --output /work/trivy-image-report.json \
            --ignorefile /work/.trivyignore.ci \
            --exit-code 1 \
            ikano-ci:${{ github.sha }}

      - name: Upload container security artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: container-security-reports
          path: |
            trivy-image-report.json
            .trivyignore.ci
          if-no-files-found: ignore
          retention-days: ${{ env.SECURITY_ARTIFACT_RETENTION_DAYS }}

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            protodoc/ikano:latest
            protodoc/ikano:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e_playwright:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ikano
          POSTGRES_PASSWORD: ikano
          POSTGRES_DB: ikano
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: ikano
      DB_USER: ikano
      DB_PASSWORD: ikano
      E2E_BASE_URL: http://127.0.0.1:8000

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          npm ci --no-fund --no-audit
          npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Start app
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/ > /dev/null; then
              echo "App is ready"
              exit 0
            fi
            sleep 1
          done
          echo "App failed to start"
          cat uvicorn.log
          exit 1

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
