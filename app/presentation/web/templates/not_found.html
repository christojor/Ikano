{% extends "base.html" %}

{% block title %}Page Not Found | Banana Bank{% endblock %}

{% block content %}
<section class="app-card">
  <div class="mb-6 inline-flex rounded-full bg-red-100 px-3 py-1 text-xs font-semibold text-brand-700">
    Error 404
  </div>

  <h1 class="text-3xl font-bold tracking-tight text-slate-900">Page Not Found</h1>
  <p class="mt-2 text-base text-slate-600">
    We could not find the page you requested.
  </p>

  <div class="mt-6 rounded-lg border border-slate-200 bg-slate-50 px-4 py-3">
    <p class="text-sm text-slate-700">
      Requested path:
      <span class="font-mono font-semibold text-slate-900">{{ path }}</span>
    </p>
  </div>

  <div class="mt-8 flex flex-wrap gap-3">
    <a
      href="/"
      class="inline-flex items-center gap-2 rounded-md bg-brand-500 px-5 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-brand-700"
    >
      <span class="material-symbols-outlined text-base">home</span>
      Go Home
    </a>
    <a
      href="/onboarding"
      class="inline-flex items-center gap-2 rounded-md border border-slate-300 bg-white px-5 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-50"
    >
      <span class="material-symbols-outlined text-base">person_add</span>
      Start Onboarding
    </a>
  </div>
</section>
{% endblock %}
