{% extends "base.html" %}

{% block title %}Start Application | Ikano Bank{% endblock %}

{% block content %}
<section class="app-card">
  <div class="mb-6">
    <a href="/" class="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-slate-700">
      <span class="material-symbols-outlined text-base">arrow_back</span>
      Back to home
    </a>
  </div>

  <h1 class="text-3xl font-bold tracking-tight text-slate-900">Start Your Application</h1>
  <p class="mt-2 text-base text-slate-600">Choose your country and account type to get started.</p>

  <form id="start-form" class="mt-8 space-y-6">
    <!-- Country -->
    <div>
      <label for="country_code" class="block text-sm font-semibold text-slate-700">Country</label>
      <select
        id="country_code"
        name="country_code"
        class="mt-2 block w-full rounded-md border border-slate-300 bg-white px-4 py-2.5 text-sm shadow-sm focus:border-brand-500 focus:outline-none focus:ring-1 focus:ring-brand-500"
        required
      >
        <option value="" disabled selected>Select a country…</option>
        <option value="SE">SE Sweden</option>
        <option value="ES">ES Spain</option>
        <option value="PL">PL Poland</option>
      </select>
    </div>

    <!-- Party type -->
    <fieldset>
      <legend class="block text-sm font-semibold text-slate-700">Account Type</legend>
      <div class="mt-3 space-y-3">
        <label class="flex items-center gap-3 cursor-pointer rounded-lg border border-slate-200 p-3 hover:bg-slate-50 has-[:checked]:border-brand-500 has-[:checked]:bg-red-50">
          <input type="radio" name="party_type_code" value="PRIVATE" class="accent-brand-500" required />
          <span class="flex flex-col">
            <span class="font-medium text-slate-900">
              <span class="material-symbols-outlined align-middle text-base">person</span>
              Private Individual
            </span>
            <span class="text-xs text-slate-500">Personal banking account</span>
          </span>
        </label>
        <label class="flex items-center gap-3 cursor-pointer rounded-lg border border-slate-200 p-3 hover:bg-slate-50 has-[:checked]:border-brand-500 has-[:checked]:bg-red-50">
          <input type="radio" name="party_type_code" value="BUSINESS" class="accent-brand-500" />
          <span class="flex flex-col">
            <span class="font-medium text-slate-900">
              <span class="material-symbols-outlined align-middle text-base">business</span>
              Business
            </span>
            <span class="text-xs text-slate-500">Business banking account</span>
          </span>
        </label>
      </div>
    </fieldset>

    <div id="form-error" class="hidden rounded-md bg-red-50 px-4 py-3 text-sm text-red-700 border border-red-200"></div>

    <button
      type="submit"
      id="submit-btn"
      class="inline-flex items-center gap-2 rounded-md bg-brand-500 px-6 py-3 text-base font-semibold text-white shadow-sm hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2 disabled:opacity-50 transition-all"
    >
      <span class="material-symbols-outlined text-base">arrow_forward</span>
      Start Application
    </button>
  </form>
</section>

<script>
  document.getElementById('start-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const btn = document.getElementById('submit-btn');
    const errBox = document.getElementById('form-error');

    const country_code = form.country_code.value;
    const party_type_code = form.querySelector('[name=party_type_code]:checked')?.value;

    if (!party_type_code) {
      errBox.textContent = 'Please select an account type.';
      errBox.classList.remove('hidden');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="material-symbols-outlined text-base">hourglass_empty</span> Starting…';
    errBox.classList.add('hidden');

    try {
      const res = await fetch('/api/onboarding/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ country_code, party_type_code }),
      });
      if (!res.ok) {
        const data = await res.json();
        throw new Error(data.detail || 'Failed to start application');
      }
      const data = await res.json();
      window.location.href = `/onboarding/${data.application_id}/step`;
    } catch (err) {
      errBox.textContent = err.message;
      errBox.classList.remove('hidden');
      btn.disabled = false;
      btn.innerHTML = '<span class="material-symbols-outlined text-base">arrow_forward</span> Start Application';
    }
  });
</script>
{% endblock %}
